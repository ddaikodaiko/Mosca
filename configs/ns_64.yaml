# Fase 1 - configuracion REAL (seccion 5 del diseno).
# No se genera en el portatil: 13 min de CPU. Se lanza en el PC con GPU.
#   python -m data.simulate_ns --config configs/ns_64.yaml
device: auto          # cuda si esta disponible, si no cpu
batch_size: 70        # trayectorias simuladas a la vez (memoria vs velocidad)
output_dir: artifacts/ns64
spectrum_band: [5, 20]   # banda para el ajuste log-log de E(k)

simulation:
  grid: 64
  dt: 0.01
  nu: 0.001
  alpha: 0.1
  forcing_wavenumber: 4     # f = sin(4y), forzado de Kolmogorov
  transient_steps: 2000     # t = 20, dos tiempos de arrastre (1/alpha = 10)
  n_save: 200
  save_every: 10            # dt_guardado = 0.1
  precision: float64        # se simula en f64 y se guarda en f32
  ic_peak_wavenumber: 4.0
  ic_rms: 1.0

# Rangos de semillas disjuntos por construccion (separados de 1000 en 1000).
splits:
  train: {seed_base: 1000, n_traj: 200}
  val:   {seed_base: 2000, n_traj: 40}
  test:  {seed_base: 3000, n_traj: 40}
