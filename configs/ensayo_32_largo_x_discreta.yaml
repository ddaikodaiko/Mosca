# ABLACION de augment.continuous_x: identico a ensayo_32_largo.yaml con la traslacion en x
# por casillas enteras. Es la unica diferencia, asi que la comparacion entre los dos aisla
# la bandera; el cribado largo cambiaba a la vez los pasos (4.000 -> 20.000) y la bandera.
# Pregunta: la traslacion en fracciones de casilla aporta algo, o el 0,0004 de mejora del
# cribado era solo por entrenar 5 veces mas?
#   python train.py --config configs/ensayo_32_largo_x_discreta.yaml --model mosca --seed 0
device: auto
data_dir: artifacts/ns32
wiring_dir: artifacts/conectoma_500_proto
output_dir: artifacts/ensayo_32_largo_x_discreta
grad_clip: 1.0

max_trajectories: {train: 200, val: 40}   # el set ns32 completo

core:
  n_internal_steps: 4
  spectral_radius: 0.95
  normalisation: max_eig

  leak: 1.0
  output_scale: 0.1

encoder:
  n_complex_modes: 64      # 128 numeros reales
  n_sensory: 64            # el denso de N=500 tiene 97 neuronas: 64 + 64 - 31 = 97
  n_motor: 64
  n_shared: 31

fno: {modes: 8, width: 16, n_layers: 3}

phase_a:
  steps: 20000
  batch_size: 16
  lr: 3.0e-3
  eval_every: 1000
  patience: 5

phase_b:
  curriculum: [5]          # el curriculo completo (5, 10, 20) es para la GPU
  steps_per_stage: 60
  batch_size: 8
  lr: 3.0e-4
  eval_every: 20
  patience: 3

# Simetrias exactas del sistema: traslacion libre en x, y en y por periodos del forzado.
augment:
  enabled: true
  forcing_wavenumber: 4
  continuous_x: false     # LA UNICA diferencia con ensayo_32_largo.yaml

evaluation:
  rollout_steps: 50
  correlation_threshold: 0.8
  permutations: 10000

eval_rollouts: [10, 50]
models: [mosca]
seeds: [0]
