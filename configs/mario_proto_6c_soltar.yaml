# Piloto 3 (19-10-2026): la receta de la 6c con la regla del NES de soltar para saltar.
#
# Los pilotos 1 y 2 (`mario_proto_6c.yaml`, `mario_proto_6c_huecos.yaml`) acabaron en
# "derecha + salto + carrera" en el 93 % de los pasos, la mosca y el MLP por igual, incluso
# en niveles donde esa constante solo llega a la meta el 10 % de las veces. En este motor
# mantener el salto rebota en cada aterrizaje; en el NES hay que soltar el boton. Medido
# sin entrenar, en 100 niveles de 160 casillas (progreso / metas):
#     sin la regla   mejor constante 0,477 / 0,17   heuristica 0,738 / 0,53
#     con la regla   mejor constante 0,106 / 0,00   heuristica 0,736 / 0,53
# Niveles: los del diseno (`mario.yaml`), sin tocar. La observacion lleva un escalar mas,
# el boton de salto pulsado (ver `PlatformerEnv`).
#
# Todo lo demas, identico a los pilotos 1 y 2. Piloto: dice si merece la pena.
device: auto
resume_every: 20
wiring_dir: artifacts/conectoma_500_proto
output_dir: artifacts/mario_proto_6c_soltar

core:
  n_internal_steps: 2
  spectral_radius: 0.95
  leak: 1.0

encoder:
  n_sensory: 56
  n_motor: 56
  n_shared: 15

level:            # la de `mario.yaml`
  width: 160
  height: 14
  gap_probability: 0.25
  step_probability: 0.30
  pipe_probability: 0.12
  enemy_probability: 0.05
  max_gap: 3

observation: {window_width: 11, window_height: 9}
reward: {progress: 1.0, step_cost: 0.02, death: 5.0, goal: 10.0, stomp: 1.0}
max_episode_steps: 1200
release_to_jump: true   # regla del NES: soltar el salto para volver a saltar

level_seeds:
  train: [0, 1000000]
  val: [2000000, 2010000]
  test: [3000000, 3010000]

ppo:
  n_envs: 16
  rollout_steps: 128
  iterations: 300      # 1,3 s por iteracion; las evaluaciones son mas largas que en el 1
  epochs: 3
  n_minibatches: 4
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.02
  entropy_final: 0.002
  grad_clip: 1.0
  normalise_returns: true

eval_every: 50   # episodios de hasta 1.200 pasos: cada evaluacion cuesta mas
eval_envs: 8
eval_episodes: 16
test_episodes: 32

models: [mosca]
seeds: [0]
