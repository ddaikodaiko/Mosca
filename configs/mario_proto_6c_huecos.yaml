# Piloto 2 (19-10-2026): la receta de la 6c en niveles donde saltar a ciegas NO funciona.
#
# El piloto 1 (`mario_proto_6c.yaml`, niveles de 60) acabo en "saltar corriendo siempre"
# con la mosca y con el MLP (93 % de los pasos, 69,5 % de metas contra 67 % de esa
# constante): en niveles cortos la constante es casi optima y no compensa mirar.
# Medido SIN entrenar nada, sobre 100 niveles de test, la mejor constante contra la
# heuristica (progreso / metas):
#     60 casillas                 0,833 / 0,67   contra 0,957 / 0,90   margen +0,23
#     160 casillas                0,477 / 0,17   contra 0,738 / 0,53   margen +0,36
#     160 casillas, huecos 0,35   0,380 / 0,07   contra 0,771 / 0,57   margen +0,50  <- esta
#     160 casillas, enemigos 0,08 0,420 / 0,11   contra 0,648 / 0,37   margen +0,26
# Elegida antes de entrenar por el margen, no por como le va a ningun modelo.
#
# Todo lo demas, identico al piloto 1. Piloto: dice si merece la pena, no responde a nada.
device: auto
resume_every: 20
wiring_dir: artifacts/conectoma_500_proto
output_dir: artifacts/mario_proto_6c_huecos

core:
  n_internal_steps: 2
  spectral_radius: 0.95
  leak: 1.0

encoder:
  n_sensory: 56
  n_motor: 56
  n_shared: 15

level:            # la de `mario.yaml` salvo los huecos (0,25 -> 0,35)
  width: 160
  height: 14
  gap_probability: 0.35
  step_probability: 0.30
  pipe_probability: 0.12
  enemy_probability: 0.05
  max_gap: 3

observation: {window_width: 11, window_height: 9}
reward: {progress: 1.0, step_cost: 0.02, death: 5.0, goal: 10.0, stomp: 1.0}
max_episode_steps: 1200

level_seeds:
  train: [0, 1000000]
  val: [2000000, 2010000]
  test: [3000000, 3010000]

ppo:
  n_envs: 16
  rollout_steps: 128
  iterations: 300      # 1,3 s por iteracion; las evaluaciones son mas largas que en el 1
  epochs: 3
  n_minibatches: 4
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.02
  entropy_final: 0.002
  grad_clip: 1.0
  normalise_returns: true

eval_every: 50   # episodios de hasta 1.200 pasos: cada evaluacion cuesta mas
eval_envs: 8
eval_episodes: 16
test_episodes: 32

models: [mosca]
seeds: [0]
