# Fase 6e (21-10-2026), EXPLORATORIA: la receta de la 6d con la normalizacion `row`.
#
# Fuera del diseno: no sustituye al veredicto registrado de la 6d. Pregunta: si el
# deficit de la mosca frente a los controles (6d: 0,462 contra 0,568 del aleatorio) viene
# del reescalado espectral. Con `max_eig` el grueso del espectro de la mosca queda en
# 0,013, contra 0,102 del recableado y 0,356 del aleatorio (`diagnostico_cableado.py`):
# su recurrencia esta casi apagada. Con `row` (cada neurona recibe la misma corriente
# total antes de llevar el autovalor mayor a 0,95) queda en 0,146 / 0,498 / 0,595.
# Unico cambio respecto a `mario_proto_6c_soltar.yaml`: `core.normalisation` y
# `output_dir`. Solo hacen falta mosca, aleatorio y recableado: `sin_nucleo` y el MLP no
# tienen aristas, y en el denso todas las neuronas reciben lo mismo, asi que `row` le da
# exactamente los mismos pesos.
#
device: auto
resume_every: 20
wiring_dir: artifacts/conectoma_500_proto
output_dir: artifacts/mario_proto_6e_row

core:
  n_internal_steps: 2
  spectral_radius: 0.95
  leak: 1.0
  normalisation: row   # la 6d usaba max_eig, el valor del diseno

encoder:
  n_sensory: 56
  n_motor: 56
  n_shared: 15

level:            # la de `mario.yaml`
  width: 160
  height: 14
  gap_probability: 0.25
  step_probability: 0.30
  pipe_probability: 0.12
  enemy_probability: 0.05
  max_gap: 3

observation: {window_width: 11, window_height: 9}
reward: {progress: 1.0, step_cost: 0.02, death: 5.0, goal: 10.0, stomp: 1.0}
max_episode_steps: 1200
release_to_jump: true   # regla del NES: soltar el salto para volver a saltar

level_seeds:
  train: [0, 1000000]
  val: [2000000, 2010000]
  test: [3000000, 3010000]

ppo:
  n_envs: 16
  rollout_steps: 128
  iterations: 300      # 1,3 s por iteracion; las evaluaciones son mas largas que en el 1
  epochs: 3
  n_minibatches: 4
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.02
  entropy_final: 0.002
  grad_clip: 1.0
  normalise_returns: true

eval_every: 50   # episodios de hasta 1.200 pasos: cada evaluacion cuesta mas
eval_envs: 8
eval_episodes: 16
test_episodes: 32

models: [mosca]
seeds: [0]
